<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'unsafe-inline'; media-src blob:"
    />
    <title>Overlay dictation</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          12px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: transparent;
        color: #f3f3f3;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-direction: column;
        height: 100vh;
        padding: 12px;
        user-select: none;
      }
      #notice {
        font-size: 12px;
        text-align: center;
        line-height: 1.45;
        max-width: 328px;
        margin: 0 0 10px;
        padding: 9px 12px;
        border: 1px solid #ffffff18;
        border-radius: 12px;
        background: #292929;
        box-shadow: 0 3px 12px #0003;
      }
      #notice:empty {
        display: none;
      }
      .pill {
        height: 42px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 7px 0 15px;
        border: 1px solid #ffffff24;
        border-radius: 24px;
        background: linear-gradient(#303030, #252525);
        box-shadow:
          0 4px 16px #0005,
          inset 0 1px #ffffff08;
        animation: enter 0.16s ease-out;
      }
      #status {
        white-space: nowrap;
        font-weight: 500;
        letter-spacing: -0.12px;
        margin: 0;
        min-width: 72px;
      }
      canvas {
        width: 42px;
        height: 22px;
        display: block;
      }
      button {
        border: 0;
        background: transparent;
        color: #aaa;
        border-radius: 50%;
        height: 28px;
        width: 28px;
        padding: 6px;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      button:hover {
        background: #ffffff12;
        color: #fff;
      }
      button:focus-visible {
        outline: 2px solid #aaa;
        outline-offset: 2px;
      }
      button svg {
        height: 16px;
        width: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      button[hidden] {
        display: none;
      }
      .divider {
        height: 16px;
        width: 1px;
        background: #ffffff16;
      }
      body[data-phase='processing'] canvas {
        opacity: 0.65;
      }
      body[data-phase='error'] #status {
        color: #f1d8b3;
      }
      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(4px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pill {
          animation: none;
        }
      }
    </style>
  </head>
  <body data-phase="idle">
    <p id="notice"></p>
    <div class="pill">
      <canvas id="meter" aria-hidden="true"></canvas>
      <p role="status" aria-live="polite" id="status">Ready</p>
      <!-- overlay:raw-control Native isolated HUD controls do not load the remote web UI bundle. -->
      <button id="finish" aria-label="Finish dictation" title="Finish dictation">
        <svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></svg>
      </button>
      <button id="retry" hidden aria-label="Retry transcription" title="Retry transcription">
        <svg viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6" /></svg>
      </button>
      <button id="copy" hidden aria-label="Copy transcription" title="Copy transcription">
        <svg viewBox="0 0 24 24">
          <rect x="8" y="8" width="12" height="13" rx="2" />
          <path d="M16 8V3H3v13h5" />
        </svg>
      </button>
      <span class="divider"></span
      ><button id="cancel" aria-label="Dismiss dictation" title="Dismiss dictation">
        <svg viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6" /></svg>
      </button>
    </div>
    <script type="module" src="./recorder.js"></script>
  </body>
</html>
