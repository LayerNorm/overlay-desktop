<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>overlay</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api-js.mixpanel.com https://api.mixpanel.com https://*.ingest.sentry.io http://localhost:* ws://localhost:*; img-src 'self' https: data: blob: overlay-media:; font-src 'self'; media-src 'self' blob: data: overlay-media:; worker-src 'self' blob:;"
    />
    <style>
      @font-face {
        font-family: 'Instrument Serif';
        src: url('../../resources/fonts/Instrument_Serif/InstrumentSerif-Regular.ttf')
          format('truetype');
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: 'Instrument Serif';
        src: url('../../resources/fonts/Instrument_Serif/InstrumentSerif-Italic.ttf')
          format('truetype');
        font-weight: 400;
        font-style: italic;
      }
      @font-face {
        font-family: 'Libre Baskerville';
        src: url('../../resources/fonts/Libre_Baskerville/LibreBaskerville-VariableFont_wght.ttf')
          format('truetype');
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: 'Libre Baskerville';
        src: url('../../resources/fonts/Libre_Baskerville/LibreBaskerville-Italic-VariableFont_wght.ttf')
          format('truetype');
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: 'Outfit';
        src: url('../../resources/fonts/Outfit/Outfit-VariableFont_wght.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: 'Outfit Regular';
        src: url('../../resources/fonts/Outfit/static/Outfit-Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(0.85);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.15);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
