name: Release macOS

# Official desktop releases stay frozen until Gate B is signed off.
# Keep jobs non-runnable rather than relying on maintainers to skip dispatch.
on:
  workflow_dispatch:
    inputs:
      release_source_sha:
        description: Full 40-character source commit to build
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: desktop-release-${{ inputs.release_source_sha }}
  cancel-in-progress: false

jobs:
  # Dry-run build enabled: signs/notarizes and uploads artifacts only.
  # publish-mac stays frozen until Gate B.
  build-mac:
    runs-on: macos-latest
    # Signing secrets live only in this protected environment (not repo-wide).
    environment: mac-release
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Validate immutable source
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.release_source_sha }}
        run: |
          if ! [[ "$RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_source_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_source_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify source and dependencies
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.release_source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          test -z "$(git status --porcelain)"
          npm run check:standalone
          npm run license:check
          npm run check:dependencies:prod
          npm run check:release-security
          npm run check:launch-controls
          npm run security:verify:source

      - name: Build, sign, and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          DEV_WORKOS_CLIENT_ID: ${{ secrets.DEV_WORKOS_CLIENT_ID }}
          WORKOS_REDIRECT_URI: overlay://auth/callback
          AUTH_STORAGE_KEY: overlay-auth-session
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: npm run build:mac:ci

      - name: Generate dependency SBOM
        run: npm run generate:sbom

      - name: Verify signed artifacts
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.release_source_sha }}
        run: npm run verify:mac-artifact

      - name: Attest verified artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
            dist/sbom.cdx.json

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: overlay-macos-${{ inputs.release_source_sha }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
            dist/sbom.cdx.json
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 7

  # Publish to this same public repo's GitHub Releases (open-source model).
  # Build job never receives write access; publish uses GITHUB_TOKEN only.
  publish-mac:
    if: ${{ false }}
    needs: build-mac
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      contents: write

    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: overlay-macos-${{ inputs.release_source_sha }}
          path: dist

      - name: Publish verified artifacts to this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SOURCE_SHA: ${{ inputs.release_source_sha }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./dist/release-manifest.json').version")"
          TAG="v${VERSION}"
          NOTES="Built from source commit ${RELEASE_SOURCE_SHA}."

          if gh release view "$TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets only."
            gh release upload "$TAG" dist/* --repo "$RELEASE_REPO" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$RELEASE_REPO" \
              --title "Overlay v${VERSION}" \
              --notes "$NOTES"
          fi
