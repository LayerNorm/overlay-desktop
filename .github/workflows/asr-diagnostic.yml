name: Offline ASR diagnostic
on:
  workflow_dispatch:
  push:
    branches: [codex/instant-dictation]
    paths: [.github/workflows/asr-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  current-upstream:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build pinned upstream v1.1.1 without product changes
        run: |
          git init /tmp/overlay-whisper-upstream
          git -C /tmp/overlay-whisper-upstream remote add origin https://github.com/argmaxinc/WhisperKit.git
          git -C /tmp/overlay-whisper-upstream fetch --depth 1 origin 1bbc57cb7fe6410248a685b1c5a3c6d56adc2ed4
          git -C /tmp/overlay-whisper-upstream checkout --detach FETCH_HEAD
          swift build --package-path /tmp/overlay-whisper-upstream --configuration release --product whisperkit-cli --disable-automatic-resolution
          cp /tmp/overlay-whisper-upstream/.build/release/whisperkit-cli whisperkit-bundle/whisperkit-cli
          chmod +x whisperkit-bundle/whisperkit-cli
          shasum -a 256 whisperkit-bundle/whisperkit-cli
      - name: Transcribe with current upstream helper
        run: npx playwright test e2e/transcription.e2e.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: offline-upstream-diagnostic
          path: |
            test-results/
            whisperkit-bundle/whisperkit-cli
          retention-days: 7
